<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MRS WORKS</title>
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MRS WORKS">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">

    <style>
        body {
            margin: 0;
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-bottom: calc(var(--ad-clearance, 78px) + env(safe-area-inset-bottom));
        }

        h1 {
            margin-top: 40px;
            font-size: 48px;
        }

        .subtitle {
            color: #aaaaaa;
            margin-bottom: 40px;
        }

        .offline-note {
            max-width: 800px;
            margin: 0 auto 24px;
            padding: 0 5%;
            color: #cccccc;
            font-size: 14px;
            line-height: 1.6;
        }

        .ad-frame {
            display: block;
            width: 320px;
            max-width: 100%;
            height: 0;
            border: 0;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: auto;
        }

        /* カードスタイル */
        .tool-card {
            background-color: #1e1e1e;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .tool-title {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .tool-description {
            color: #cccccc;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        /* ボタンのスタイル */
        .tool-button {
            display: inline-block;
            padding: 12px 30px;
            background-color: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.2s, opacity 0.2s;
        }

        .tool-button:hover {
            opacity: 0.8;
        }

        /* 画面最下部固定広告 */
        .ad-banner {
            position: fixed;
            z-index: 90;
            right: 0;
            bottom: 0;
            left: 0;
            display: flex;
            justify-content: center;
            width: 100%;
            padding: 1px 0 calc(1px + env(safe-area-inset-bottom));
            border-top: 1px solid #292929;
            background: #0d0d0d;
        }

        .ad-banner-inner {
            max-width: 100%;
            line-height: 0;
        }
    </style>
</head>

<body>

<h1>MRS WORKS</h1>

<p class="subtitle">
    Top page of MRS WORKS
</p>
<p id="offline-note" class="offline-note" role="status" hidden>
    オフラインです。ホームは表示できますが、各アプリやお問い合わせ先を開くには通信が必要です。
</p>

    <!-- ボタン -->
    <div class="container">

        <div class="tool-card">
            <div class="tool-title">GAMES</div>
            <p class="tool-description">
                ゲーム類
            </p>
            <a class="tool-button" href="https://mrs-games.pages.dev">GO</a>
        </div>

        <div class="tool-card">
            <div class="tool-title">TOOLS</div>
            <p class="tool-description">
                ツール類
            </p>
            <a class="tool-button" href="https://mrs-tools.pages.dev">GO</a>
        </div>

        <div class="tool-card">
            <div class="tool-title">KIDS</div>
            <p class="tool-description">
                小さなお子さま向けのWebあそび
            </p>
            <a class="tool-button" href="https://kids-home-eh3.pages.dev/">GO</a>
        </div>

    </div>


    <!-- お問い合わせ & フッター領域 -->
    <div style="margin-top: 50px; padding: 20px; border-top: 1px solid #333;">
        <p style="color: #aaaaaa; font-size: 14px; margin-bottom: 10px;">
            不具合報告・お問い合わせは以下よりお願いします
        </p>
        <a class="tool-button" 
           style="background-color: #4b5563; font-size: 14px; padding: 8px 16px; font-weight: normal;" 
           href="https://forms.gle/ix4si4HowgRRzaXYA" 
           target="_blank" 
           rel="noopener noreferrer">
            お問い合わせフォーム
        </a>

        <!-- プライバシーポリシーリンクを追加 -->
        <p style="margin-top: 15px; font-size: 12px;">
            <a href="privacy.html" style="color: #aaaaaa; text-decoration: underline;">プライバシーポリシー</a>
        </p>
    </div>

    <script>
        (() => {
            const note = document.getElementById('offline-note');
            const updateConnection = () => { note.hidden = navigator.onLine !== false; };
            updateConnection();
            window.addEventListener('online', updateConnection);
            window.addEventListener('offline', updateConnection);
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' })
                    .catch(() => { /* ホームの表示・リンク操作は継続できます。 */ });
            }
        })();
    </script>

    <!-- 画面固定広告：本体の解析・初期化を待たせない独立した文書 -->
    <div class="ad-banner" aria-label="広告">
        <div class="ad-banner-inner">
        <iframe class="ad-frame" title="広告" scrolling="no"
            srcdoc="<!doctype html><html lang='ja'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><style>html,body{margin:0;background:#0d0d0d}body{line-height:0}</style><body><script>const resize=()=>{if(window.frameElement)window.frameElement.style.height=Math.ceil(document.body.getBoundingClientRect().height)+'px'};new ResizeObserver(resize).observe(document.body);</script><script src='https://adm.shinobi.jp/s/1596a166ea799d6e2c02f5a97ee144c2'></script></body></html>"></iframe>
        </div>
    </div>
    <script>
        (() => {
            const inner = document.querySelector('.ad-banner-inner');
            // Measure only the ad; safe-area is added once by the body CSS.
            const updateClearance = () => {
                document.body.style.setProperty('--ad-clearance',
                    Math.max(78, Math.ceil(inner.getBoundingClientRect().height) + 19) + 'px');
            };
            if ('ResizeObserver' in window) new ResizeObserver(updateClearance).observe(inner);
            updateClearance();
        })();
    </script>
    <!-- Cloudflare Web Analytics -->
    <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "9d457fbe13254326bae7e1abc277a01f"}'></script>
    <!-- End Cloudflare Web Analytics -->
    <!-- MRS Analytics: home only, non-blocking, no offline queue -->
    <script async src="analytics.js" data-site-id="works-home"></script>
</body>
</html>
