<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRS WORKS</title>

    <style>
        body {
            margin: 0;
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-bottom: 100px;
        }

        h1 {
            margin-top: 40px;
            font-size: 48px;
        }

        .subtitle {
            color: #aaaaaa;
            margin-bottom: 40px;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: auto;
        }

        /* カードスタイル */
        .tool-card {
            background-color: #1e1e1e;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .tool-title {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .tool-description {
            color: #cccccc;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        /* ボタンのスタイル */
        .tool-button {
            display: inline-block;
            padding: 12px 30px;
            background-color: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.2s, opacity 0.2s;
        }

        .tool-button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

<h1>MRS WORKS</h1>

<p class="subtitle">
    Top page of MRS WORKS
</p>


<!-- 広告表示、変更後 -->
<div style="
    position: fixed;
    bottom: 0; 
    left: 0; 
    width: 100%; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    background-color: #121212; 
    z-index: 1000; 
    padding: 10px 0;
    ">

        <div style="max-width: 100%;">
            <!-- admax -->
            <script src="https://adm.shinobi.jp/s/1596a166ea799d6e2c02f5a97ee144c2"></script>
            <!-- admax -->
        </div>
    </div>

    <!-- ボタン -->
    <div class="container">

        <div class="tool-card">
            <div class="tool-title">GAMES</div>
            <p class="tool-description">
                ゲーム類
            </p>
            <a class="tool-button" href="https://mrs-games.pages.dev">GO</a>
        </div>

        <div class="tool-card">
            <div class="tool-title">TOOLS</div>
            <p class="tool-description">
                ツール類
            </p>
            <a class="tool-button" href="https://mrs-tools.pages.dev">GO</a>
        </div>


    </div>


    <div style="margin-top: 50px; padding: 20px; border-top: 1px solid #333;">
        <p style="color: #aaaaaa; font-size: 14px; margin-bottom: 10px;">
            ご意見・バグ報告・お問い合わせは以下よりお願いいたします
        </p>
        <a class="tool-button" 
           style="background-color: #4b5563; font-size: 14px; padding: 8px 16px; font-weight: normal;" 
           href="https://forms.gle/ix4si4HowgRRzaXYA" 
           target="_blank" 
           rel="noopener noreferrer">
            お問い合わせ・バグ報告
        </a>
    </div>

</body>
</html>
